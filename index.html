<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1c2430;--mu:#6b7686;--bd:#e3e7ee;--ac:#1f6feb;--ok:#1a7f4b;--wa:#b7791f;--er:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1b222c;--tx:#e8edf3;--mu:#93a0b2;--bd:#2a3340;--ac:#4c8dff;--ok:#43c383;--wa:#e0a84a;--er:#ef6a5b}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font-family:inherit}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:640px;margin:0 auto;padding:16px 14px 100px}
h1{font-size:19px;font-weight:700;letter-spacing:-.01em;margin:6px 0 10px}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}
.hd h1{margin:0}
.hdb{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
#who{margin-top:6px;line-height:1.4;overflow-wrap:anywhere}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{font-weight:600;flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:15px}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;margin-bottom:8px}
textarea{min-height:70px}
.row{display:flex;gap:8px}.row>*{flex:1}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.card b{font-size:16px;font-weight:600}.mu{color:var(--mu);font-size:13px;line-height:1.45}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;border:1px solid var(--bd);margin-right:4px}
.s-ok{color:var(--ok)}.s-wa{color:var(--wa)}.s-er{color:var(--er)}
.act{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.btn{font-weight:500;padding:9px 13px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:14px;text-decoration:none}
.btn.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ac);color:#fff;border:0;border-radius:99px;padding:14px 20px;font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.top{display:flex;gap:8px}.top input{margin:0}
.stats{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.stats div{flex:1 1 90px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;white-space:nowrap;text-align:center}
.stats b{display:block;font-size:19px;font-weight:700}
.stats div{font-size:13px;color:var(--mu)}
.stats b{color:var(--tx)}
.note{font-size:12px;color:var(--mu);margin:6px 0}
.login{max-width:360px;margin:12vh auto;padding:0 16px}
.err{color:var(--er);font-size:13px;margin:6px 0}
@media (min-width:700px){
  .wrap{max-width:880px;padding:24px 24px 110px}
  h1{font-size:22px}
  .modal{align-items:center}
  .sheet{max-width:560px;border-radius:16px;max-height:90%}
  .fab{right:32px;bottom:32px}
}
@media (min-width:1024px){
  html,body{font-size:16px}
  .wrap{max-width:1180px}
  #list{display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:12px;align-items:start}
  #list .card{margin-bottom:0}
  .tabs button{max-width:260px}
}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
var sb=supabase.createClient("https://smxjcandsguqnkfdevxt.supabase.co","sb_publishable_Trk5PF7L7DM_bpgFXCLlLg_xE-h_VSN");
var LS=["New","Contacted","Interested","Deal done","Not interested"],CS=["Open","In progress","Resolved"];
var lim=100,nameAsked=false,tab="leads",data={leads:[],complaints:[]},me=null,members=[],names={},isAdmin=false,viewUid="all",dueOnly=false,editing=null;
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function today(){return new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10)}
function isDue(x){return x.follow_up&&x.follow_up<=today()&&x.status!=="Deal done"&&x.status!=="Not interested"}
function stCls(s){return(s==="Deal done"||s==="Resolved")?"s-ok":(s==="Not interested"||s==="Open")?"s-er":"s-wa"}

function normPhone(s){var d=String(s==null?"":s).replace(/\D/g,"").replace(/^0+/,"");if(d.length===12&&d.slice(0,2)==="91")d=d.slice(2);return d}
function leadKey(x){var p=normPhone(x.phone);return p?"p"+p:"n"+String(x.name||"").toLowerCase()+"|"+String(x.address||"").toLowerCase()}
async function fetchAll(t){
  var out=[],from=0,step=1000;
  while(true){
    var r=await sb.from(t).select("*").order("created_at",{ascending:false}).order("id",{ascending:true}).range(from,from+step-1);
    if(r.error)return{data:null,error:r.error};
    out=out.concat(r.data||[]);
    if(!r.data||r.data.length<step)break;
    from+=step;
  }
  return{data:out,error:null};
}

/* ---------- whatsapp reminders (sent to the user's own WhatsApp) ---------- */
function getMyWa(){try{return localStorage.getItem("crm_wa")||""}catch(e){return""}}
function setMyWa(){
  var v=prompt("Enter your own WhatsApp number (10 digits, or with country code). Reminders will be sent to this number.",getMyWa());
  if(v===null)return"";
  var d=String(v).replace(/\D/g,"").replace(/^0+/,"");
  if(d.length===10)d="91"+d;
  if(d.length<11){alert("Please enter a valid number");return""}
  try{localStorage.setItem("crm_wa",d)}catch(e){}
  return d;
}
function myWa(){return getMyWa()||setMyWa()}
function openWa(n,t){window.open("https://wa.me/"+n+"?text="+encodeURIComponent(t),"_blank")}
function remind(x){
  var n=myWa();if(!n)return;
  openWa(n,"Follow-up reminder\nLead: "+(x.name||"No name")+"\nPhone: "+(x.phone||"-")+"\nDate: "+(x.follow_up||"-")+(x.notes?"\nNotes: "+x.notes:""));
}
function sendSummary(){
  var n=myWa();if(!n)return;
  var L=data.leads.filter(function(x){return(viewUid==="all"||x.owner_id===viewUid)&&isDue(x)}).sort(function(a,b){return a.follow_up<b.follow_up?-1:1});
  if(!L.length){alert("No follow-ups due");return}
  var t="Follow-ups due ("+L.length+")\n"+L.slice(0,15).map(function(x,i){return(i+1)+". "+(x.name||"No name")+" - "+(x.phone||"no phone")+" ("+x.follow_up+")"}).join("\n");
  if(L.length>15)t+="\n+"+(L.length-15)+" more in the CRM";
  openWa(n,t);
}

/* ---------- login ---------- */
function showLogin(msg){
  $("app").innerHTML='<div class="login"><h1>My CRM</h1><input id="em" type="email" placeholder="Email" autocomplete="username"><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><div class="err" id="er">'+esc(msg||"")+'</div><button class="btn p" id="go" style="width:100%;padding:12px">Sign in</button></div>';
  $("go").onclick=async function(){
    $("go").disabled=true;$("er").textContent="";
    var r=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
    if(r.error){$("er").textContent=r.error.message;$("go").disabled=false;return}
    start(r.data.user);
  };
}
function deviceId(){
  try{var d=localStorage.getItem("crm_dev");if(!d){d=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(36).slice(2));localStorage.setItem("crm_dev",d)}return d}catch(e){return"nostorage"}
}
async function deviceOk(){
  var r=await sb.rpc("claim_device",{dev:deviceId(),label:(navigator.userAgent||"").slice(0,120)});
  if(r.error){return{ok:false,msg:"Device check failed: "+r.error.message}}
  return r.data===true?{ok:true}:{ok:false,msg:"This account is already registered on another device. Ask your admin to reset your device."};
}
async function start(u){
  var dv=await deviceOk();
  if(!dv.ok){await sb.auth.signOut();viewUid="all";me=null;showLogin(dv.msg);return}
  me=u;
  $("app").innerHTML='<div class="wrap"><div class="hd"><div style="display:flex;align-items:center;gap:10px"><img id="myavatar" alt="Profile" style="display:none;width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid var(--bd)"><div><h1 style="margin-bottom:0">My CRM</h1><div class="mu" id="who"></div></div></div><div class="hdb"><button class="btn" id="mywa">📲 My WhatsApp no.</button><button class="btn" id="out">Sign out</button></div></div>'+
  '<div class="tabs"><button id="t-leads" class="on">Leads</button><button id="t-comp">Complaints</button></div>'+
  '<div class="stats" id="stats"></div><div id="today"></div><div id="dist"></div><select id="mem" style="display:none"></select>'+
  '<div class="top"><input id="q" placeholder="Search name, phone, area…"><select id="f" style="width:130px;margin:0"></select></div>'+
  '<div style="height:10px"></div><div id="list"></div><div class="note" id="mode"></div></div>'+
  '<button class="fab" id="add">+ New</button><div class="modal" id="m"><div class="sheet" id="sheet"></div></div>';
  $("out").onclick=async function(){await sb.auth.signOut();viewUid="all";dueOnly=false;tab="leads";lim=100;nameAsked=false;isAdmin=false;me=null;data={leads:[],complaints:[]};showLogin()};
  $("mywa").onclick=function(){setMyWa()};
  $("t-leads").onclick=function(){setTab("leads")};
  $("t-comp").onclick=function(){setTab("complaints")};
  $("add").onclick=function(){openForm()};
  $("q").oninput=function(){lim=100;render()};$("f").onchange=function(){lim=100;render()};
  $("mem").onchange=function(){viewUid=this.value;lim=100;render()};
  $("today").addEventListener("click",function(e){var v=e.target.dataset.v;if(v){lim=100;viewUid=v;dueOnly=(v!=="all");if($("mem"))$("mem").value=v;render()}});
  $("m").addEventListener("click",function(e){if(e.target===$("m"))closeForm()});
  $("list").addEventListener("click",function(e){
    var t=e.target;
    if(t.dataset.lg){var lx=data[tab].find(function(x){return x.id===t.dataset.i});if(lx)logAct(lx,t.dataset.lg)}
    if(t.dataset.e)openForm(data[tab].find(function(x){return x.id===t.dataset.e}));
    if(t.dataset.d)delItem(t.dataset.d);
    if(t.dataset.r){var it=data[tab].find(function(x){return x.id===t.dataset.r});if(it)remind(it)}
  });
  await load();
}
function setTab(t){tab=t;lim=100;$("f").value="";$("q").value="";$("t-leads").className=t==="leads"?"on":"";$("t-comp").className=t==="complaints"?"on":"";render()}

/* ---------- data ---------- */
async function load(){
  var r=await Promise.all([
    fetchAll("leads"),
    fetchAll("complaints"),
    sb.from("profiles").select("*")]);
  if(r[0].error){alert("Could not load data: "+r[0].error.message);return}
  data.leads=r[0].data||[];data.complaints=r[1].data||[];members=r[2].data||[];
  members.forEach(function(m){names[m.id]=m.full_name||m.email||"Member"});
  var mine=members.find(function(m){return m.id===me.id});
  isAdmin=!!(mine&&mine.role==="admin");
  $("who").textContent="👤 "+(names[me.id]||me.email)+" ("+(isAdmin?"Admin":"Employee")+")";
  var myav=$("myavatar");if(myav){if(mine&&mine.avatar_url){myav.src=mine.avatar_url;myav.style.display="block"}else{myav.style.display="none"}}
  if(mine&&!mine.full_name&&!nameAsked)askName();
  var s=$("mem");
  if(isAdmin){s.style.display="block";s.innerHTML='<option value="all">All members</option>'+members.map(function(m){return'<option value="'+m.id+'"'+(m.id===viewUid?" selected":"")+'>'+esc(names[m.id])+'</option>'}).join("")}
  $("mode").textContent=isAdmin?"Admin view: you can see all members’ data.":"This is your own panel.";
  render();
}
async function delItem(id){
  if(!confirm("Are you sure you want to delete this?"))return;
  var r=await sb.from(tab).delete().eq("id",id);
  if(r.error){alert(r.error.message);return}
  await load();
}

/* ---------- render ---------- */
function waUrl(x){
  var d=String(x.phone||"").replace(/\D/g,"").replace(/^0+/,"");if(d.length===10)d="91"+d;
  var m=tab==="leads"?"Hello "+(x.name||"")+", I am following up on our recent conversation. Is it a good time to talk?":"Hello "+(x.name||"")+", I wanted to give you an update on your complaint.";
  return"https://wa.me/"+d+"?text="+encodeURIComponent(m);
}
function calLink(x){
  if(tab!=="leads"||!x.follow_up)return"";
  var a=x.follow_up.replace(/-/g,"");
  return'<a class="btn" target="_blank" rel="noopener" href="https://calendar.google.com/calendar/render?action=TEMPLATE&amp;text='+encodeURIComponent("Follow-up: "+(x.name||""))+"&amp;dates="+a+"T100000/"+a+"T103000&amp;details="+encodeURIComponent("Phone: "+(x.phone||"")+"\n"+(x.notes||""))+'">⏰ Reminder</a>';
}
function render(){
  if(!$("list"))return;
  var sts=tab==="leads"?LS:CS;
  var arr=data[tab].filter(function(x){return(viewUid==="all"||x.owner_id===viewUid)&&(!(dueOnly&&tab==="leads")||isDue(x))});
  var fv=$("f").value||"";
  $("f").innerHTML='<option value="">All statuses</option>'+sts.map(function(s){return'<option'+(s===fv?" selected":"")+'>'+s+'</option>'}).join("");
  var base=data[tab].filter(function(x){return viewUid==="all"||x.owner_id===viewUid});
  $("stats").innerHTML='<div><b>'+base.length+'</b>Total</div>'+sts.map(function(s){return'<div><b>'+base.filter(function(x){return x.status===s}).length+'</b>'+s+'</div>'}).join("");
  var dueN=data.leads.filter(function(x){return(viewUid==="all"||x.owner_id===viewUid)&&isDue(x)}).length;
  var wb=(tab==="leads"&&dueN)?'<button class="btn" id="wasum" style="width:100%;margin-bottom:10px">📲 Send today’s follow-ups to my WhatsApp</button>':"";
  var td=today();
  if(tab==="leads"&&isAdmin){
    var rows=members.map(function(m){var L=data.leads.filter(function(x){return x.owner_id===m.id&&isDue(x)});return{m:m,t:L.filter(function(x){return x.follow_up===td}).length,o:L.filter(function(x){return x.follow_up<td}).length}}).filter(function(r){return r.t+r.o>0});
    $("today").innerHTML='<div class="card"><b>📅 Team follow-ups today</b>'+(rows.length?rows.map(function(r){return'<div class="row" style="align-items:center;margin-top:8px"><div>'+esc(names[r.m.id])+'<div class="mu">Today: '+r.t+' · Overdue: '+r.o+'</div></div><button class="btn" style="flex:0 0 auto" data-v="'+r.m.id+'">View</button></div>'}).join(""):'<div class="mu" style="margin-top:6px">No follow-ups due today.</div>')+((viewUid!=="all"||dueOnly)?'<button class="btn" data-v="all" style="width:100%;margin-top:10px">Show all</button>':"")+'</div>'+wb;
  }else{
    var nd=data.leads.filter(function(x){return(viewUid==="all"||x.owner_id===viewUid)&&isDue(x)}).length;
    $("today").innerHTML=((tab==="leads"&&nd)?'<button class="btn p" id="dueb" style="width:100%;margin-bottom:10px">⏰ Follow-ups due: '+nd+(dueOnly?' (show all)':' (view)')+'</button>':"")+wb;
    if($("dueb"))$("dueb").onclick=function(){dueOnly=!dueOnly;render()};
  }
  if($("wasum"))$("wasum").onclick=sendSummary;
  $("dist").innerHTML=isAdmin?'<div class="row" style="margin-bottom:10px">'+(tab==="leads"?'<button class="btn" id="distb">📤 Distribute leads</button>':"")+'<button class="btn" id="teamb">👥 Team</button></div>':"";
  if($("distb"))$("distb").onclick=openDist;
  if($("teamb"))$("teamb").onclick=openTeam;
  var q=$("q").value.toLowerCase();
  arr=arr.filter(function(x){return(!fv||x.status===fv)&&(!q||JSON.stringify(x).toLowerCase().indexOf(q)>-1)});
  var totalN=arr.length;arr=arr.slice(0,lim);
  if(!arr.length){$("list").innerHTML='<div class="card mu">Nothing here yet. Tap "+ New"'+(tab==="leads"?" or import a CSV.":".")+'</div>';return}
  $("list").innerHTML=arr.map(function(x){
    var h='<div class="card"><b>'+esc(x.name||"(no name)")+'</b> '+(isAdmin?'<span class="tag">👤 '+esc(names[x.owner_id]||"Member")+'</span>':"")+'<span class="tag '+stCls(x.status)+'">'+esc(x.status)+'</span>';
    if(tab==="leads"){
      h+=(x.company?'<div>🏢 '+esc(x.company)+'</div>':"")+'<div class="mu">'+esc(x.address||"")+'</div><div>'+(x.phone?'📞 '+esc(x.phone):"")+' <span class="tag">'+(x.website?"Has website":"No website")+'</span></div>';
      if(x.follow_up)h+='<div class="mu">Follow-up: '+esc(x.follow_up)+'</div>';
    }else h+='<div class="mu">'+(x.phone?'📞 '+esc(x.phone)+' · ':"")+esc(x.complaint_date||"")+'</div><div>'+esc(x.issue||"")+'</div>';
    if(x.notes)h+='<div class="mu">📝 '+esc(x.notes)+'</div>';
    h+='<div class="act">'+(x.phone?'<a class="btn" data-lg="Call" data-i="'+x.id+'" href="tel:'+esc(x.phone)+'">Call</a><a class="btn" data-lg="WhatsApp" data-i="'+x.id+'" target="_blank" rel="noopener" href="'+waUrl(x)+'">WhatsApp</a>':"")+calLink(x)+(x.follow_up?'<button class="btn" data-r="'+x.id+'">📲 Remind me</button>':"")+'<button class="btn" data-e="'+x.id+'">Edit</button><button class="btn" data-d="'+x.id+'">Delete</button></div></div>';
    return h;
  }).join("")+(totalN>arr.length?'<button class="btn" id="more" style="grid-column:1/-1;width:100%">Show more ('+(totalN-arr.length)+' left)</button>':"");
  if($("more"))$("more").onclick=function(){lim+=100;render()};
}

/* ---------- form ---------- */
function opts(a,v){return a.map(function(s){return'<option'+(s===v?" selected":"")+'>'+s+'</option>'}).join("")}
function openForm(x){
  x=x||{};editing=x;
  var h='<h1>'+(x.id?"Edit ":"New ")+(tab==="leads"?"lead":"complaint")+'</h1>';
  h+='<input id="f_name" placeholder="'+(tab==="leads"?"Customer name *":"Name / business name")+'" value="'+esc(x.name)+'">'+(tab==="leads"?'<input id="f_company" placeholder="Company name *" value="'+esc(x.company)+'">':"")+'<input id="f_phone" type="tel" inputmode="numeric" maxlength="10" pattern="[0-9]{10}" placeholder="Mobile number (10 digits)'+(tab==="leads"?" *":"")+'" value="'+esc(x.phone)+'">';
  if(tab==="leads"){
    h+='<input id="f_address" placeholder="Address / area *" value="'+esc(x.address)+'"><input id="f_website" placeholder="Website (leave empty if none)" value="'+esc(x.website)+'"><div class="note">Fields marked * are required.</div>';
    h+='<select id="f_status">'+opts(LS,x.status)+'</select><div class="mu">Follow-up date</div><input id="f_fu" type="date" value="'+esc(x.follow_up)+'">';
  }else{
    h+='<textarea id="f_issue" placeholder="What is the complaint?">'+esc(x.issue)+'</textarea><input id="f_date" type="date" value="'+esc(x.complaint_date||today())+'"><select id="f_status">'+opts(CS,x.status)+'</select>';
  }
  h+='<textarea id="f_talk" placeholder="What did you talk about today? (visible to admin)"></textarea><textarea id="f_notes" placeholder="Notes">'+esc(x.notes)+'</textarea><div class="row"><button class="btn p" id="save">Save</button><button class="btn" id="cancel">Cancel</button></div>';
  if(tab==="leads"&&!x.id&&isAdmin)h+='<hr style="border:0;border-top:1px solid var(--bd);margin:14px 0"><b>Import Outscraper CSV</b><div class="note">Choose the CSV file. Name, address, phone and website are added automatically.</div><input id="csv" type="file" accept=".csv,text/csv">';
  $("sheet").innerHTML=h;$("m").classList.add("on");
  $("cancel").onclick=closeForm;
  $("save").onclick=saveForm;
  if($("csv"))$("csv").onchange=importCsv;
}
function closeForm(){$("m").classList.remove("on")}
async function saveForm(){
  var g=function(i){var e=$(i);return e?e.value.trim():undefined};
  var o={name:g("f_name"),phone:g("f_phone"),status:g("f_status"),notes:g("f_notes")},talk=g("f_talk"),was=editing.status;
  if(!o.name&&!o.phone){alert("Enter a name or phone");return}
  o.phone=String(o.phone||"").trim();
  if(o.phone && !/^[0-9]{10}$/.test(o.phone)){alert("Mobile number must contain exactly 10 digits (numbers only).");return}
  if(tab==="leads"){o.address=g("f_address");o.website=g("f_website");o.follow_up=g("f_fu")||null;o.company=g("f_company");
    var miss=[];if(!o.name)miss.push("Customer name");if(!o.company)miss.push("Company name");if(!o.phone)miss.push("Contact number");if(!o.address)miss.push("Address");
    if(miss.length){alert("Required: "+miss.join(", "));return}}
  else{o.issue=g("f_issue");o.complaint_date=g("f_date")||null}
  $("save").disabled=true;
  var r=editing.id?await sb.from(tab).update(o).eq("id",editing.id):await sb.from(tab).insert(o).select("id").single();
  if(r.error){alert(r.error.message);$("save").disabled=false;return}
  var iid=editing.id||(r.data&&r.data.id);
  if(talk||(editing.id&&o.status!==was))await logAct({id:iid,name:o.name,phone:o.phone},talk?"Talk":"Status change",talk,o.status);
  closeForm();await load();
}

  }).join(""):'<div class="card mu">No activity on this day.</div>';

/* ---------- CSV import ---------- */
function parseCsv(t){
  var r=[],row=[],f="",q=false;
  for(var i=0;i<t.length;i++){var c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===","){row.push(f);f=""}
    else if(c==="\n"){row.push(f);r.push(row);row=[];f=""}
    else if(c!=="\r")f+=c;
  }
  if(f||row.length){row.push(f);r.push(row)}
  return r;
}
async function importCsv(ev){
  var file=ev.target.files[0];if(!file)return;
  var rows=parseCsv((await file.text()).replace(/^\uFEFF/,""));
  if(rows.length<2){alert("The CSV looks empty");return}
  var hd=rows[0].map(function(h){return h.trim().toLowerCase()});
  var ix=function(n){for(var k=0;k<n.length;k++){var j=hd.indexOf(n[k]);if(j>-1)return j}return -1};
  var cn=ix(["name"]),ca=ix(["full_address","address"]),cp=ix(["phone","phone_1"]),cw=ix(["site","website"]);
  if(cn<0){alert("No 'name' column found");return}
  var invalidPhones=0,dups=0,seen={};data.leads.forEach(function(l){seen[leadKey(l)]=1});
  var items=rows.slice(1).filter(function(r){return r[cn]}).map(function(r){return{name:String(r[cn]||"").trim(),company:String(r[cn]||"").trim(),address:ca>-1?r[ca]:"",phone:cp>-1?normPhone(r[cp]):"",website:cw>-1?r[cw]:"",status:"New"}}).filter(function(x){if(x.phone&&!/^[0-9]{10}$/.test(x.phone)){invalidPhones++;return false}var k=leadKey(x);if(seen[k]){dups++;return false}seen[k]=1;return true});
  if(!items.length){alert("No valid rows to import. Phone numbers must be exactly 10 digits, or left blank.");return}
  $("save").disabled=true;$("save").textContent="Importing…";
  for(var k=0;k<items.length;k+=200){
    var r=await sb.from("leads").insert(items.slice(k,k+200));
    if(r.error){alert(r.error.message);break}
  }
  closeForm();await load();alert(items.length+" leads imported."+(invalidPhones?"\nSkipped "+invalidPhones+" rows with invalid phone numbers.":"")+(dups?"\nSkipped "+dups+" duplicates.":""));
}

/* ---------- distribute leads (admin) ---------- */
function pool(){return data.leads.filter(function(x){return x.owner_id===me.id&&x.status==="New"})}
function openDist(){
  var p=pool().length,emps=members.filter(function(m){return m.id!==me.id});
  var h='<h1>Distribute leads</h1><div class="mu">Leads available (yours, status New): <b>'+p+'</b></div><div style="height:8px"></div>';
  if(!emps.length)h+='<div class="card mu">No team members yet. Add users in Supabase first.</div>';
  emps.forEach(function(m){h+='<div class="row" style="align-items:center"><div>'+esc(names[m.id])+'</div><input class="dn" data-u="'+m.id+'" type="number" min="0" placeholder="0" style="margin:0 0 8px"></div>'});
  h+='<div class="row"><button class="btn" id="eq">Split equally</button><button class="btn p" id="send">Send</button></div><button class="btn" id="dc" style="width:100%;margin-top:8px">Cancel</button><div class="note">Sent leads move to the employee’s panel and leave yours.</div>';
  $("sheet").innerHTML=h;$("m").classList.add("on");
  $("dc").onclick=closeForm;
  $("eq").onclick=function(){var ins=document.querySelectorAll(".dn");if(!ins.length)return;var per=Math.floor(p/ins.length);var rem=p-per*ins.length;ins.forEach(function(i,ix){i.value=per+(ix<rem?1:0)})};
  $("send").onclick=doDist;
}
async function doDist(){
  var ids=pool().map(function(x){return x.id}),ins=document.querySelectorAll(".dn"),plan=[],tot=0;
  ins.forEach(function(i){var n=parseInt(i.value)||0;if(n>0){plan.push({u:i.dataset.u,n:n});tot+=n}});
  if(!plan.length){alert("Enter how many leads each employee gets");return}
  if(tot>ids.length){alert("You entered "+tot+" but only "+ids.length+" leads are available");return}
  if(!confirm("Send "+tot+" leads?"))return;
  $("send").disabled=true;var pos=0;
  for(var k=0;k<plan.length;k++){
    var part=ids.slice(pos,pos+plan[k].n);pos+=plan[k].n;
    var bad=null;
    for(var j=0;j<part.length&&!bad;j+=100){var r=await sb.from("leads").update({owner_id:plan[k].u}).in("id",part.slice(j,j+100));if(r.error)bad=r.error}
    if(bad){alert(bad.message);break}
  }
  closeForm();await load();alert(tot+" leads sent.");
}

/* ---------- transfer data between employees (admin) ---------- */
function openTransfer(fromId){
  var others=members.filter(function(m){return m.id!==fromId});
  if(!others.length){alert("No other team member to transfer to");return}
  var h='<h1>Transfer data</h1><div class="note">Move all leads and complaints of '+esc(names[fromId])+' to another team member.</div><select id="tt">'+others.map(function(m){return'<option value="'+m.id+'">'+esc(names[m.id])+'</option>'}).join("")+'</select><div class="row"><button class="btn p" id="tgo">Transfer</button><button class="btn" id="tx">Cancel</button></div>';
  $("sheet").innerHTML=h;$("m").classList.add("on");
  $("tx").onclick=openTeam;
  $("tgo").onclick=async function(){
    var to=$("tt").value;
    if(!confirm("Move all data from "+names[fromId]+" to "+names[to]+"?"))return;
    $("tgo").disabled=true;
    var a=await sb.from("leads").update({owner_id:to}).eq("owner_id",fromId);
    var b=await sb.from("complaints").update({owner_id:to}).eq("owner_id",fromId);
    if(a.error||b.error){alert((a.error||b.error).message);$("tgo").disabled=false;return}
    await load();alert("Transfer complete.");openTeam();
  };
}

/* ---------- team (admin) ---------- */
function genPw(){var c="abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789",a=new Uint32Array(10),o="";crypto.getRandomValues(a);for(var i=0;i<a.length;i++)o+=c[a[i]%c.length];return o}
function openAdd(){
  var h='<h1>Add employee</h1><input id="an" placeholder="Full name" autocomplete="off"><input id="ae" type="email" placeholder="Email (this is the login ID)" autocapitalize="none" autocomplete="off"><input id="ap" placeholder="Password" value="'+genPw()+'" autocomplete="off"><div class="note">A password is suggested automatically. You can change it. Share it with the employee after creating.</div><div class="err" id="aer"></div><div class="row"><button class="btn p" id="ago">Create</button><button class="btn" id="ax">Cancel</button></div>';
  $("sheet").innerHTML=h;$("m").classList.add("on");
  $("ax").onclick=openTeam;
  $("ago").onclick=async function(){
    var n=$("an").value.trim(),e=$("ae").value.trim(),p=$("ap").value;
    if(n.length<2){$("aer").textContent="Enter the employee's name";return}
    if(!e){$("aer").textContent="Enter an email";return}
    if(p.length<8){$("aer").textContent="Password must be at least 8 characters";return}
    $("ago").disabled=true;
    var r=await sb.rpc("admin_create_user",{new_email:e,new_password:p,new_name:n});
    if(r.error){$("aer").textContent=r.error.message;$("ago").disabled=false;return}
    var info="Name: "+n+"\nEmail: "+e.toLowerCase()+"\nPassword: "+p+"\nLogin: "+location.origin+location.pathname;
    try{await navigator.clipboard.writeText(info)}catch(x){}
    await load();
    alert("Employee created.\n\n"+info+"\n\n(Copied to clipboard. Share it with the employee.)");
    openTeam();
  };
}
async function openTeam(){
  var st={};
  try{var sr=await sb.rpc("admin_user_status");if(!sr.error)(sr.data||[]).forEach(function(u){st[u.id]=u.active})}catch(x){}
  var h='<h1>Team</h1><button class="btn p" id="addb" style="width:100%;margin-bottom:10px">➕ Add employee</button><div class="note">Passwords are stored encrypted and cannot be viewed. If someone forgets theirs, set a new one here and tell them.</div>';
  members.forEach(function(m){
    var off=st[m.id]===false;
    h+='<div class="card"><div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">'+(m.avatar_url?'<img src="'+esc(m.avatar_url)+'" alt="Profile" style="width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid var(--bd)">':'<div style="width:52px;height:52px;border-radius:50%;background:var(--bd);display:flex;align-items:center;justify-content:center;font-size:22px">👤</div>')+'<div><b data-dash="'+m.id+'" style="cursor:pointer;color:var(--ac)">'+esc(names[m.id])+'</b><div class="mu">'+esc(m.email||"")+'</div></div></div><span class="tag">'+esc(m.role||"employee")+'</span>'+(off?'<span class="tag s-er">Deactivated</span>':"")+'<div class="act"><button class="btn p" data-dash="'+m.id+'">📊 Today’s work</button><button class="btn" data-avatar="'+m.id+'">Upload/change photo</button><button class="btn" data-n="'+m.id+'">Edit name</button><button class="btn" data-t="'+m.id+'">Transfer data</button><button class="btn" data-p="'+esc(m.email||"")+'">Set new password</button>'+(m.role==="admin"?"":'<button class="btn" data-rd="'+m.id+'">Reset device</button>')+(m.id!==me.id?'<button class="btn" data-a="'+m.id+'" data-s="'+(off?"on":"off")+'">'+(off?"Activate":"Deactivate")+'</button>':"")+'</div></div>';
  });
  h+='<button class="btn" id="tc" style="width:100%">Close</button>';
  $("sheet").innerHTML=h;$("m").classList.add("on");
  $("tc").onclick=closeForm;
  $("addb").onclick=openAdd;
  $("sheet").onclick=async function(e){
    var d=e.target.dataset;
    if(d.avatar){
      var targetId=d.avatar,inp=document.createElement("input");inp.type="file";inp.accept="image/png,image/jpeg,image/webp";
      inp.onchange=async function(){
        var file=inp.files&&inp.files[0];if(!file)return;
        if(file.size>3*1024*1024){alert("Photo must be 3 MB or smaller.");return}
        if(["image/jpeg","image/png","image/webp"].indexOf(file.type)<0){alert("Choose JPG, PNG, or WEBP image.");return}
        var ext=file.type==="image/png"?"png":file.type==="image/webp"?"webp":"jpg";
        var path=targetId+"/profile."+ext;
        var up=await sb.storage.from("employee-avatars").upload(path,file,{upsert:true,contentType:file.type,cacheControl:"3600"});
        if(up.error){alert("Photo upload failed: "+up.error.message+"\nCheck Storage bucket and policies.");return}
        var pub=sb.storage.from("employee-avatars").getPublicUrl(path);
        var url=pub.data.publicUrl+"?v="+Date.now();
        var sv=await sb.rpc("admin_set_avatar",{target_id:targetId,new_avatar_url:url});
        if(sv.error){alert("Photo uploaded but profile save failed: "+sv.error.message+"\nRun the setup SQL first.");return}
        await load();openTeam();alert("Employee profile photo updated.");
      };inp.click();return;
    }
    if(d.rd){
      if(!confirm("Reset device for "+names[d.rd]+"? They can then log in from a new device (the first one to log in becomes their device)."))return;
      var rr2=await sb.rpc("admin_reset_device",{target_id:d.rd});
      if(rr2.error){alert(rr2.error.message);return}
      alert("Device reset. "+names[d.rd]+" can now log in from a new device.");return;
    }
    if(d.dash){openDash(d.dash);return}
    if(d.t){openTransfer(d.t);return}
    if(d.a){
      var on=d.s==="on";
      if(!confirm((on?"Activate ":"Deactivate ")+names[d.a]+"?"))return;
      var ar=await sb.rpc("admin_set_active",{target_id:d.a,active:on});
      if(ar.error){alert(ar.error.message);return}
      openTeam();return;
    }
    if(d.n){
      var cur=names[d.n]||"";
      var nm=prompt("Employee name",cur.indexOf("@")<0?cur:"");
      if(!nm||!nm.trim())return;
      var rr=await sb.rpc("admin_set_name",{target_id:d.n,new_name:nm});
      if(rr.error){alert(rr.error.message);return}
      await load();openTeam();return;
    }
    if(d.p){
      var em=d.p;
      var pw=prompt("New password for "+em+" (minimum 8 characters). You can keep this suggested one or type your own:",genPw());if(!pw)return;
      var r=await sb.rpc("admin_set_password",{target_email:em,new_password:pw});
      if(r.error){alert(r.error.message);return}
      var info="Email: "+em+"\nPassword: "+pw;
      try{await navigator.clipboard.writeText(info)}catch(x){}
      alert("Password updated.\n\n"+info+"\n\n(Copied to clipboard. Share it with the employee.)");
    }
  };
}
